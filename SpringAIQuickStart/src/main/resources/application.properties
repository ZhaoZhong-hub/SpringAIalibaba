# ??????
server.port=8080
# Session 只用 Cookie 跟踪，避免重定向 URL 后面附带 ;jsessionid=xxx
server.servlet.session.tracking-modes=cookie
# 默认地址
spring.ai.deepseek.base-url=https://api.deepseek.com
# ApiKey
spring.ai.deepseek.api-key=
# 模型
spring.ai.deepseek.model-name=deepseek-flash
# 聊天温度偏移 介于0-2之间，0偏移量最小，2偏移量最大
spring.ai.deepseek.chat.options.temperature=0.8

# ===== 登录账号配置（默认用户名/密码，可自行修改） =====
app.security.username=admin
app.security.password=123456