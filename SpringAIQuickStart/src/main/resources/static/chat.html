<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>智能助手</title>
    <style>
        :root {
            --brand: #2563eb;
            --brand-hover: #1d4ed8;
            --text: #111827;
            --muted: #6b7280;
            --faint: #9ca3af;
            --line: #e5e7eb;
            --line-soft: #f0f1f3;
            --bg: #ffffff;
            --bg-soft: #f4f4f5;
            --bubble-ai: #f4f4f5;
            --code-bg: #f6f8fa;
            --code-head: #eaeef2;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #ececee;
            color: var(--text);
            overflow: hidden;
            font-size: 14px;
        }
        .hidden { display: none !important; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; }
        textarea { font-family: inherit; }

        .app-view { height: 100%; padding: 14px; display: flex; }
        .app-shell {
            flex: 1;
            display: flex;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,.05);
        }

        /* ---- 左侧栏 ---- */
        .sidebar {
            width: 232px;
            flex-shrink: 0;
            border-right: 1px solid var(--line-soft);
            display: flex;
            flex-direction: column;
            background: #fbfbfc;
        }
        .side-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 16px 14px 10px;
            font-weight: 600;
            font-size: 14px;
        }
        .side-logo {
            width: 22px; height: 22px;
            border-radius: 6px;
            background: var(--brand);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700;
        }
        .new-chat-btn {
            margin: 4px 12px 12px;
            padding: 9px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--bg);
            font-size: 13px;
            color: var(--text);
            transition: all .15s;
        }
        .new-chat-btn:hover { border-color: var(--brand); color: var(--brand); }
        .session-scroll { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
        .group-label { font-size: 12px; color: var(--faint); padding: 12px 8px 6px; }
        .session-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 10px;
            border: 1px solid transparent;
            border-radius: 10px;
            font-size: 13px;
            color: var(--muted);
            cursor: pointer;
            margin-bottom: 2px;
            transition: all .12s;
        }
        .session-item:hover { background: var(--bg-soft); color: var(--text); }
        .session-item.active {
            background: var(--bg);
            border-color: var(--line);
            color: var(--text);
            box-shadow: 0 1px 3px rgba(0,0,0,.04);
        }
        .session-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
        .session-del {
            display: none;
            color: var(--faint);
            font-size: 15px;
            line-height: 1;
            padding: 2px 4px;
            border-radius: 6px;
            flex-shrink: 0;
        }
        .session-item:hover .session-del { display: block; }
        .session-del:hover { color: #dc2626; background: #fef2f2; }
        .side-foot {
            border-top: 1px solid var(--line-soft);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--faint);
        }
        .side-foot .dot { color: #22c55e; margin-right: 5px; }
        .logout-link { color: var(--faint); font-size: 12px; text-decoration: none; }
        .logout-link:hover { color: #dc2626; }

        /* ---- 主区 ---- */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .main-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 18px;
            border-bottom: 1px solid var(--line-soft);
        }
        .main-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tag {
            font-size: 11px;
            color: var(--muted);
            background: var(--bg-soft);
            border-radius: 6px;
            padding: 3px 8px;
            flex-shrink: 0;
        }
        .main-head .spacer { flex: 1; }
        .icon-btn {
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px;
            color: var(--faint);
            flex-shrink: 0;
        }
        .icon-btn:hover { background: var(--bg-soft); color: var(--text); }

        /* ---- 消息区 ---- */
        .chat-scroll { flex: 1; overflow-y: auto; padding: 24px 28px 12px; }
        .msg { display: flex; gap: 12px; margin-bottom: 22px; }
        .msg.user { flex-direction: row-reverse; }
        .msg-avatar {
            font-size: 12px;
            color: var(--muted);
            flex-shrink: 0;
            width: 56px;
            padding-top: 4px;
            text-align: left;
        }
        .msg.user .msg-avatar { text-align: right; }
        .msg-body { max-width: 78%; min-width: 0; }
        .bubble {
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.7;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .msg.ai .bubble { background: var(--bubble-ai); border-top-left-radius: 4px; }
        .msg.user .bubble { background: var(--brand); color: #fff; border-top-right-radius: 4px; }
        .bubble.streaming::after { content: "▍"; animation: blink 1s infinite; color: var(--brand); }
        @keyframes blink { 50% { opacity: 0; } }

        .code-card {
            background: var(--code-bg);
            border: 1px solid var(--line-soft);
            border-radius: 10px;
            margin: 10px 0;
            overflow: hidden;
        }
        .code-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 12px;
            background: var(--code-head);
            font-size: 12px;
            color: var(--muted);
            font-family: Consolas, monospace;
        }
        .copy-btn { font-size: 12px; color: var(--muted); padding: 2px 6px; border-radius: 6px; }
        .copy-btn:hover { background: #fff; color: var(--text); }
        .code-card pre {
            padding: 12px 14px;
            overflow-x: auto;
            font-family: Consolas, "JetBrains Mono", monospace;
            font-size: 12.5px;
            line-height: 1.6;
            white-space: pre;
            margin: 0;
        }
        .inline-code {
            font-family: Consolas, monospace;
            font-size: 12.5px;
            background: rgba(0,0,0,.05);
            padding: 1px 5px;
            border-radius: 4px;
        }
        .msg.user .inline-code { background: rgba(255,255,255,.2); }

        .welcome {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--muted);
        }
        .welcome h2 { font-size: 20px; color: var(--text); font-weight: 600; }
        .welcome p { font-size: 13px; color: var(--faint); }
        .welcome-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 22px;
            width: 100%;
            max-width: 480px;
        }
        .wcard {
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px;
            text-align: left;
            background: var(--bg);
            transition: all .15s;
        }
        .wcard:hover { border-color: var(--brand); }
        .wcard b { display: block; font-size: 13px; margin-bottom: 3px; font-weight: 600; }
        .wcard span { font-size: 12px; color: var(--faint); }

        /* ---- 输入区 ---- */
        .input-zone { padding: 10px 28px 18px; }
        .input-box {
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--bg);
            padding: 12px 14px 8px;
            transition: border-color .15s, box-shadow .15s;
        }
        .input-box:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37,99,235,.08); }
        .input-box textarea {
            width: 100%;
            border: none;
            outline: none;
            resize: none;
            font-size: 14px;
            line-height: 1.6;
            max-height: 160px;
            background: transparent;
        }
        .input-foot { display: flex; align-items: center; margin-top: 6px; }
        .input-foot .tools { display: flex; gap: 4px; }
        .mini-btn {
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px;
            color: var(--faint);
        }
        .mini-btn:hover { background: var(--bg-soft); color: var(--text); }
        .input-foot .hint { margin-left: auto; font-size: 12px; color: var(--faint); }
        .send-btn {
            padding: 7px 18px;
            background: var(--brand);
            color: #fff;
            border-radius: 9px;
            font-size: 13px;
            margin-left: 12px;
            transition: background .15s;
        }
        .send-btn:hover { background: var(--brand-hover); }
        .send-btn:disabled { opacity: .5; cursor: default; }
        .send-btn.stop { background: #111827; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #d9dade; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #c3c6cc; }
    </style>
</head>
<body>

<div class="app-view">
    <div class="app-shell">

        <!-- 左侧栏 -->
        <aside class="sidebar">
            <div class="side-head"><span class="side-logo">智</span>智能助手</div>
            <button id="newChatBtn" class="new-chat-btn">＋ 新建会话</button>
            <div id="sessionList" class="session-scroll"></div>
            <div class="side-foot">
                <span><span class="dot">●</span>deepseek-chat</span>
                <a id="logoutBtn" class="logout-link" href="javascript:void(0)">退出</a>
            </div>
        </aside>

        <!-- 主区 -->
        <main class="main">
            <div class="main-head">
                <div id="convTitle" class="main-title">新会话</div>
                <span class="tag">流式输出</span>
                <div class="spacer"></div>
                <span id="whoami" class="tag">—</span>
                <button id="clearBtn" class="icon-btn" title="清空当前会话">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m-9 0v14a2 2 0 002 2h6a2 2 0 002-2V6"/></svg>
                </button>
            </div>

            <div id="chatScroll" class="chat-scroll">
                <div id="welcome" class="welcome">
                    <h2>今天想聊点什么？</h2>
                    <p>支持流式回答、代码高亮与复制</p>
                    <div class="welcome-cards">
                        <button class="wcard" data-q="用 Spring AI 实现流式输出的思路是什么？"><b>Spring AI 流式输出</b><span>Flux + 流式响应的实现方式</span></button>
                        <button class="wcard" data-q="RAG 检索召回率上不去，一般从哪儿入手排查？"><b>RAG 检索优化</b><span>分片、检索与重排序</span></button>
                        <button class="wcard" data-q="Java 并发里 volatile 和 synchronized 的区别？"><b>Java 并发基础</b><span>可见性与互斥的选择</span></button>
                        <button class="wcard" data-q="帮我审查一段代码，指出潜在问题"><b>代码审查</b><span>粘贴代码让我帮你分析</span></button>
                    </div>
                </div>
                <div id="msgList"></div>
            </div>

            <div class="input-zone">
                <div class="input-box">
                    <textarea id="input" rows="1" placeholder="继续追问，或粘贴代码让我帮你分析..."></textarea>
                    <div class="input-foot">
                        <div class="tools">
                            <button class="mini-btn" title="清空输入框" id="clearInputBtn">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 4H3m3 4h12l-1 12H7L6 8z"/></svg>
                            </button>
                        </div>
                        <span class="hint">Enter 发送 · Shift+Enter 换行</span>
                        <button id="sendBtn" class="send-btn">发送</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
(function () {
    "use strict";

    var API = {
        me: "/api/me",
        logout: "/api/logout",
        stream: "/ai/generate/stream",
        sync: "/ai/generate"
    };

    var STORE_KEY = "ai_chat_sessions_v2";   // 拿到用户名后追加后缀，实现按人隔离
    var sessions = [];
    var currentId = null;
    var generating = false;
    var abortCtrl = null;

    var $ = function (id) { return document.getElementById(id); };
    var sessionList = $("sessionList"), msgList = $("msgList"), welcome = $("welcome");
    var chatScroll = $("chatScroll"), convTitle = $("convTitle");
    var input = $("input"), sendBtn = $("sendBtn");

    // ---------- 工具 ----------
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
    function load() {
        try {
            var raw = localStorage.getItem(STORE_KEY);
            return raw ? JSON.parse(raw) : [];
        } catch (e) { return []; }
    }
    function save() {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(sessions)); } catch (e) {}
    }
    function current() {
        for (var i = 0; i < sessions.length; i++) if (sessions[i].id === currentId) return sessions[i];
        return null;
    }
    function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    // ---------- 轻量 Markdown：代码块 / 行内代码 / 粗体 / 标题 / 列表 ----------
    function renderContent(text) {
        var html = "";
        var parts = String(text).split(/```/);
        for (var i = 0; i < parts.length; i++) {
            if (i % 2 === 1) {
                var block = parts[i];
                var nl = block.indexOf("\n");
                var head = "", body = block;
                if (nl >= 0) { head = block.slice(0, nl).trim(); body = block.slice(nl + 1); }
                html += '<div class="code-card"><div class="code-head"><span>' + escapeHtml(head || "代码") +
                        '</span><button class="copy-btn" data-copy>复制</button></div><pre>' +
                        escapeHtml(body.replace(/\n$/, "")) + "</pre></div>";
            } else {
                var seg = escapeHtml(parts[i]);
                seg = seg.split("\n").map(function (line) {
                    var h = line.match(/^#{1,4}\s+(.*)/);
                    if (h) return "<b>" + h[1] + "</b>";
                    var li = line.match(/^(\s*)[-*]\s+(.*)/);
                    if (li) return li[1] + "• " + li[2];
                    var ol = line.match(/^(\s*)(\d+)\.\s+(.*)/);
                    if (ol) return ol[1] + ol[2] + ". " + ol[3];
                    return line;
                }).join("\n");
                seg = seg.replace(/`([^`\n]+)`/g, '<span class="inline-code">$1</span>');
                seg = seg.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
                html += seg;
            }
        }
        return html;
    }

    // ---------- 会话管理 ----------
    function createSession() {
        var s = { id: uid(), title: "新会话", createdAt: Date.now(), msgs: [] };
        sessions.unshift(s);
        currentId = s.id;
        save();
        renderAll();
        input.focus();
        return s;
    }
    function deleteSession(id, ev) {
        ev.stopPropagation();
        for (var i = 0; i < sessions.length; i++) {
            if (sessions[i].id === id) { sessions.splice(i, 1); break; }
        }
        if (currentId === id) currentId = sessions.length ? sessions[0].id : null;
        if (!sessions.length) createSession();
        else { save(); renderAll(); }
    }
    function groupLabel(ts) {
        var d = new Date(ts), t = new Date();
        var day = function (x) { return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(); };
        var diff = (day(t) - day(d)) / 86400000;
        if (diff < 1) return "今天";
        if (diff < 2) return "昨天";
        return "更早";
    }
    function renderSessions() {
        var html = "", lastGroup = null;
        sessions.forEach(function (s) {
            var g = groupLabel(s.createdAt);
            if (g !== lastGroup) { html += '<div class="group-label">' + g + "</div>"; lastGroup = g; }
            html += '<div class="session-item' + (s.id === currentId ? " active" : "") + '" data-id="' + s.id + '">' +
                    '<span class="session-title">' + escapeHtml(s.title) + "</span>" +
                    '<span class="session-del" data-del="' + s.id + '" title="删除">×</span></div>';
        });
        sessionList.innerHTML = html;
    }
    function appendMsg(role, content, streaming) {
        var div = document.createElement("div");
        div.className = "msg " + (role === "user" ? "user" : "ai");
        div.innerHTML =
            '<div class="msg-avatar">' + (role === "user" ? "我" : "智能助手") + "</div>" +
            '<div class="msg-body"><div class="bubble' + (streaming ? " streaming" : "") + '">' +
            (streaming ? escapeHtml(content) : renderContent(content)) + "</div></div>";
        msgList.appendChild(div);
        chatScroll.scrollTop = chatScroll.scrollHeight;
        return div.querySelector(".bubble");
    }
    function renderMessages() {
        var s = current();
        msgList.innerHTML = "";
        welcome.classList.toggle("hidden", !!(s && s.msgs.length));
        if (!s) return;
        convTitle.textContent = s.title;
        s.msgs.forEach(function (m) { appendMsg(m.role, m.content, false); });
        chatScroll.scrollTop = chatScroll.scrollHeight;
    }
    function renderAll() { renderSessions(); renderMessages(); }

    // ---------- 对话 ----------
    function toLogin() { window.location.replace("/login"); }

    function send() {
        var text = input.value.trim();
        if (!text || generating) return;
        var s = current() || createSession();
        input.value = ""; input.style.height = "auto";

        s.msgs.push({ role: "user", content: text });
        if (s.title === "新会话") {
            s.title = text.length > 14 ? text.slice(0, 14) + "…" : text;
            convTitle.textContent = s.title;
            renderSessions();
        }
        welcome.classList.add("hidden");
        appendMsg("user", text, false);
        save();

        var bubble = appendMsg("ai", "", true);
        generating = true;
        sendBtn.textContent = "停止";
        sendBtn.classList.add("stop");
        abortCtrl = new AbortController();

        var acc = "", gotAny = false;
        var onChunk = function (piece) {
            gotAny = true;
            acc += piece;
            bubble.innerHTML = renderContent(acc);
            bubble.classList.add("streaming");
            chatScroll.scrollTop = chatScroll.scrollHeight;
        };
        var onDone = function () {
            bubble.classList.remove("streaming");
            bubble.innerHTML = renderContent(acc || "（模型没有返回内容）");
            s.msgs.push({ role: "assistant", content: acc || "（模型没有返回内容）" });
            save();
            finishGen();
        };
        var onFail = function (msg) {
            bubble.classList.remove("streaming");
            bubble.innerHTML = '<span style="color:#dc2626">' + escapeHtml(msg) + "</span>";
            finishGen();
        };
        tryStream(text, onChunk, onDone, onFail, function () { return gotAny; });
    }

    function finishGen() {
        generating = false;
        abortCtrl = null;
        sendBtn.textContent = "发送";
        sendBtn.classList.remove("stop");
        input.focus();
    }

    // 流式优先，失败回退同步接口
    function tryStream(text, onChunk, onDone, onFail, gotAny) {
        fetch(API.stream + "?message=" + encodeURIComponent(text), {
            method: "GET",
            credentials: "same-origin",
            signal: abortCtrl ? abortCtrl.signal : undefined
        }).then(function (resp) {
            if (resp.status === 401) { toLogin(); throw new Error("unauthorized"); }
            if (!resp.ok) throw new Error("HTTP " + resp.status);
            var reader = resp.body.getReader();
            var decoder = new TextDecoder("utf-8");
            // 后端是原始文本流（逐 token 输出，空格/换行原样保留），直接解码追加
            function pump() {
                return reader.read().then(function (r) {
                    if (r.done) {
                        if (!gotAny()) onDone();
                        return;
                    }
                    var t = decoder.decode(r.value, { stream: true });
                    if (t) onChunk(t);
                    return pump();
                });
            }
            return pump();
        }).catch(function (e) {
            if (e.name === "AbortError") { onDone(); return; }
            if (e.message === "unauthorized") return;
            fetch(API.sync + "?message=" + encodeURIComponent(text), {
                method: "GET", credentials: "same-origin"
            }).then(function (r2) {
                if (r2.status === 401) { toLogin(); return null; }
                return r2.text();
            }).then(function (t) {
                if (typeof t === "string" && t) { onChunk(t); onDone(); }
                else if (typeof t === "string") onFail("服务返回为空，请查看后端日志");
            }).catch(function () { onFail("请求失败：后端服务未启动或网络异常"); });
        });
    }

    // ---------- 事件 ----------
    $("newChatBtn").addEventListener("click", function () { if (!generating) createSession(); });
    $("logoutBtn").addEventListener("click", function () {
        fetch(API.logout, { method: "POST", credentials: "same-origin" })
            .catch(function () {})
            .then(toLogin);
    });
    $("clearBtn").addEventListener("click", function () {
        var s = current();
        if (s && !generating) { s.msgs = []; s.title = "新会话"; save(); renderAll(); }
    });
    $("clearInputBtn").addEventListener("click", function () { input.value = ""; input.style.height = "auto"; input.focus(); });

    sessionList.addEventListener("click", function (e) {
        var del = e.target.closest("[data-del]");
        if (del && !generating) { deleteSession(del.getAttribute("data-del"), e); return; }
        var item = e.target.closest(".session-item");
        if (item) { currentId = item.getAttribute("data-id"); renderAll(); }
    });

    sendBtn.addEventListener("click", function () {
        if (generating && abortCtrl) { abortCtrl.abort(); return; }
        send();
    });
    input.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
    input.addEventListener("input", function () {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 160) + "px";
    });
    welcome.addEventListener("click", function (e) {
        var card = e.target.closest(".wcard");
        if (card && !generating) { input.value = card.getAttribute("data-q"); send(); }
    });
    document.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-copy]");
        if (!btn) return;
        var pre = btn.closest(".code-card").querySelector("pre");
        var text = pre.textContent;
        var done = function () { btn.textContent = "已复制"; setTimeout(function () { btn.textContent = "复制"; }, 1500); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text); done(); });
        } else { fallbackCopy(text); done(); }
    });
    function fallbackCopy(text) {
        var ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(ta);
    }

    // ---------- 启动：先确认登录态，未登录直接跳登录页 ----------
    fetch(API.me, { credentials: "same-origin" })
        .then(function (r) {
            if (!r.ok) { toLogin(); return null; }
            return r.json().catch(function () { return {}; });
        })
        .then(function (data) {
            if (!data) return;
            if (data.username) {
                document.title = "智能助手 · " + data.username;
                var who = document.getElementById("whoami");
                if (who) who.textContent = data.username;
                STORE_KEY = "ai_chat_sessions_v2_" + data.username;   // 会话按用户隔离
            }
            sessions = load();
            if (!sessions.length) createSession();
            else { currentId = sessions[0].id; renderAll(); }
        })
        .catch(toLogin);
})();
</script>
</body>
</html>
