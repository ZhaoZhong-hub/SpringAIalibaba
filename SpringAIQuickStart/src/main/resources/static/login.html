<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>登录 · 智能助手</title>
    <style>
        :root {
            --brand: #2563eb;
            --brand-hover: #1d4ed8;
            --text: #111827;
            --muted: #6b7280;
            --faint: #9ca3af;
            --line: #e5e7eb;
            --danger: #dc2626;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #ececee;
            color: var(--text);
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        button { font-family: inherit; cursor: pointer; border: none; background: none; }
        .card {
            width: 100%;
            max-width: 370px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 40px 34px 30px;
            box-shadow: 0 16px 50px rgba(0,0,0,.07);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 26px;
        }
        .logo {
            width: 34px; height: 34px;
            border-radius: 10px;
            background: var(--brand);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 700;
        }
        .brand-txt h1 { font-size: 17px; font-weight: 600; }
        .brand-txt p { font-size: 12px; color: var(--faint); margin-top: 2px; }
        .field { margin-bottom: 15px; }
        .field label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 7px;
        }
        .field input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid var(--line);
            border-radius: 11px;
            font-size: 14px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        .field input:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(37,99,235,.08);
        }
        .submit {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background: var(--brand);
            color: #fff;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 500;
            transition: background .15s;
        }
        .submit:hover { background: var(--brand-hover); }
        .submit:disabled { opacity: .6; cursor: default; }
        .err {
            color: var(--danger);
            font-size: 13px;
            margin-top: 12px;
            min-height: 18px;
            text-align: center;
        }
        .foot {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid #f0f1f3;
            text-align: center;
            font-size: 12px;
            color: var(--faint);
        }
    </style>
</head>
<body>
<div class="card">
    <div class="brand">
        <div class="logo">智</div>
        <div class="brand-txt">
            <h1>智能助手</h1>
            <p>Java + Spring AI 对话演示</p>
        </div>
    </div>

    <div class="field">
        <label>用户名</label>
        <input id="username" type="text" placeholder="请输入用户名" autocomplete="username"/>
    </div>
    <div class="field">
        <label>密码</label>
        <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password"/>
    </div>

    <button id="loginBtn" class="submit">登 录</button>
    <div id="err" class="err"></div>

    <div class="foot">登录状态由服务端 Session 保持</div>
</div>

<script>
(function () {
    "use strict";
    var usernameI = document.getElementById("username");
    var passwordI = document.getElementById("password");
    var loginBtn = document.getElementById("loginBtn");
    var err = document.getElementById("err");

    function login() {
        var u = usernameI.value.trim();
        var p = passwordI.value;
        if (!u || !p) { err.textContent = "请输入用户名和密码"; return; }
        loginBtn.disabled = true;
        err.textContent = "";
        fetch("/api/login", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: u, password: p })
        }).then(function (r) {
            if (r.ok) {
                // 登录成功 → 进入对话主界面
                window.location.replace("/chat");
                return;
            }
            loginBtn.disabled = false;
            err.textContent = r.status === 401 ? "用户名或密码错误" : "登录失败（HTTP " + r.status + "）";
        }).catch(function () {
            loginBtn.disabled = false;
            err.textContent = "无法连接服务器，请确认后端已启动";
        });
    }

    loginBtn.addEventListener("click", login);
    passwordI.addEventListener("keydown", function (e) { if (e.key === "Enter") login(); });
    usernameI.addEventListener("keydown", function (e) { if (e.key === "Enter") passwordI.focus(); });
    usernameI.focus();
})();
</script>
</body>
</html>
